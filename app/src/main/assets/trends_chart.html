<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trends Chart</title>
    <style>
        html, body { margin: 0; height: 100%; background: transparent; }
        #chart { width: 100%; height: 100%; }
    </style>
    <script src="echarts.min.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
    var chart = echarts.init(document.getElementById('chart'));

    chart.setOption({
        grid: { left: 40, right: 16, top: 28, bottom: 28 },
        tooltip: { trigger: 'axis' },
        xAxis: {
            type: 'category',
            data: [],
            axisLabel: { color: '#ffffffcc' },
            axisLine: { lineStyle: { color: '#ffffff66' } },
            axisTick: { show: false }
        },
        yAxis: {
            type: 'value',
            name: '',
            nameTextStyle: { color: '#ffffffcc' },
            axisLabel: { color: '#ffffffcc' },
            splitLine: { lineStyle: { color: '#ffffff22' } }
        },
        series: [
            {
                name: 'Trend',
                type: 'line',
                data: [],
                smooth: true,
                showSymbol: true,
                symbolSize: 8,
                lineStyle: { color: '#ffffff', width: 3 },
                itemStyle: { color: '#FFD60A' },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#ffffff66' },
                        { offset: 1, color: '#ffffff00' }
                    ])
                }
            }
        ]
    });

    // Called from Kotlin: setData(labels, values, unit)
    function setData(labels, values, unit) {
        chart.setOption({
            xAxis: { data: labels },
            yAxis: { name: unit || '' },
            series: [{ data: values }]
        });
    }

    window.onresize = function () { chart.resize(); };
</script>
</body>
</html>
