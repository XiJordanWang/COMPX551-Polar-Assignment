<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body { margin: 0; height: 100%; background: transparent; }
        #chart { width: 100%; height: 100%; }
    </style>
    <script src="echarts.min.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
    // https://echarts.apache.org/examples/en/editor.html?c=area-basic
    var chart = echarts.init(document.getElementById('chart'));

    chart.setOption({
        grid: { left: 40, right: 16, top: 24, bottom: 32 },
        xAxis: {
            type: 'category',
            data: [],
            name: 's',
            axisLabel: { color: '#ffffffcc' },
            axisLine: { lineStyle: { color: '#ffffff66' } }
        },
        yAxis: {
            type: 'value',
            min: 40,
            max: 200,
            interval: 20,
            axisLabel: { color: '#ffffffcc' },
            splitLine: { lineStyle: { color: '#ffffff22' } }
        },
        series: [{
            type: 'line',
            data: [],
            smooth: true,
            showSymbol: false,
            // White so it stands out on the orange garden background
            lineStyle: { color: '#ffffff', width: 3 },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#ffffff88' },
                    { offset: 1, color: '#ffffff00' }
                ])
            }
        }],
        animationDuration: 300
    });

    // Called from Kotlin every second with the latest heart rates
    function setData(heartRates, startSecond) {
        var seconds = [];
        for (var i = 0; i < heartRates.length; i++) {
            seconds.push(startSecond + i);
        }
        chart.setOption({
            xAxis: { data: seconds },
            series: [{ data: heartRates }]
        });
    }

    window.onresize = function () { chart.resize(); };
</script>
</body>
</html>
