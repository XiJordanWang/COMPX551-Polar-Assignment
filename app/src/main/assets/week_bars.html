<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Workouts and Rolling Mean</title>
    <style>
        html, body { margin: 0; height: 100%; background: transparent; }
        #chart { width: 100%; height: 100%; }
    </style>
    <script src="echarts.min.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
    // Daily workout minutes (bars) with 7-day rolling mean (line)
    var chart = echarts.init(document.getElementById('chart'));

    chart.setOption({
        grid: { left: 36, right: 16, top: 28, bottom: 28 },
        tooltip: { trigger: 'axis' },
        xAxis: {
            type: 'category',
            data: [],
            axisLabel: { color: '#ffffffcc' },
            axisLine: { lineStyle: { color: '#ffffff66' } },
            axisTick: { show: false }
        },
        yAxis: {
            type: 'value',
            name: 'min',
            nameTextStyle: { color: '#ffffffcc' },
            axisLabel: { color: '#ffffffcc' },
            splitLine: { lineStyle: { color: '#ffffff22' } }
        },
        series: [
            {
                name: 'Minutes',
                type: 'bar',
                data: [],
                barMaxWidth: 24,
                itemStyle: { color: '#ffffff', borderRadius: [6, 6, 0, 0] }
            },
            {
                name: '7-day Mean',
                type: 'line',
                data: [],
                smooth: true,
                showSymbol: true,
                symbolSize: 6,
                lineStyle: { color: '#FFD60A', width: 3 },
                itemStyle: { color: '#FFD60A' }
            }
        ]
    });

    // Called from Kotlin
    // labels: ['Mon', 'Tue', ...]
    // minutes: [30, 0, 45, ...]
    // rollingMean: [25, 20, 22.5, ...]
    function setData(labels, minutes, rollingMean) {
        chart.setOption({
            xAxis: { data: labels },
            series: [
                { data: minutes },
                { data: rollingMean }
            ]
        });
    }

    window.onresize = function () { chart.resize(); };
</script>
</body>
</html>
